<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Nelayan Pintar V5</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eaf7ff;
    margin: 0;
    padding: 15px;
}

.app {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

h1 {
    text-align: center;
    color: #006994;
}

h2 {
    color: #006994;
    margin-top: 25px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    background: #0077b6;
    color: white;
}

button:active {
    transform: scale(.98);
}

.berangkat {
    background: #f77f00;
}

.pulang {
    background: #008000;
}

.kompasBtn {
    background: #6a4c93;
}

.hapus {
    background: #d62828;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

#status {
    margin-top: 15px;
    padding: 14px;
    background: #f1f9fc;
    border-radius: 12px;
}

/* =========================
   PANEL NAVIGASI
========================= */

#navigasi {
    display: none;
    margin-top: 15px;
    padding: 20px;
    background: #eef9ee;
    border-radius: 18px;
    text-align: center;
}

#panah {

    width: 170px;
    height: 170px;

    margin: 15px auto;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 110px;

    transform: rotate(0deg);

    transition: transform .3s ease;
}

#derajat {
    font-size: 28px;
    font-weight: bold;
}

#arahText {
    font-size: 22px;
    margin-top: 8px;
}

#jarak {
    font-size: 24px;
    margin-top: 15px;
}

/* =========================
   KOMPAS
========================= */

#kompas {
    display: none;
    margin-top: 15px;
    padding: 20px;
    border-radius: 18px;
    background: #f5effb;
    text-align: center;
}

#kompasLingkaran {

    width: 230px;
    height: 230px;

    border: 5px solid #333;

    border-radius: 50%;

    margin: 15px auto;

    position: relative;

    background: white;
}

.angka {
    position: absolute;
    font-weight: bold;
    font-size: 18px;
}

.utara {
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
}

.timur {
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
}

.selatan {
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
}

.barat {
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
}

#jarumKompas {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 6px;
    height: 90px;

    background: #d62828;

    transform-origin: bottom center;

    transform:
    translate(-50%, -100%)
    rotate(0deg);

    border-radius: 5px;
}

#titikTengah {

    position: absolute;

    width: 18px;
    height: 18px;

    background: #333;

    border-radius: 50%;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);
}

/* =========================
   PETA
========================= */

#map {

    width: 100%;

    height: 400px;

    margin-top: 15px;

    border-radius: 15px;
}

/* =========================
   DAFTAR
========================= */

.titik {

    margin-top: 12px;

    padding: 14px;

    background: #f5f5f5;

    border-radius: 12px;
}

</style>

</head>


<body>


<div class="app">


<h1>🚤 NELAYAN PINTAR</h1>

<p style="text-align:center">
🧭 GPS + Kompas + Navigasi Pulang
</p>


<!-- =======================
     TITIK BERANGKAT
======================= -->

<h2>⚓ Titik Berangkat</h2>

<button
class="berangkat"
onclick="simpanTitikBerangkat()">

⚓ SIMPAN TITIK BERANGKAT

</button>

<div id="infoBerangkat">

Belum ada titik berangkat.

</div>


<!-- =======================
     LOKASI MANCING
======================= -->

<h2>🎣 Lokasi Mancing</h2>

<input
id="namaLokasi"
type="text"
placeholder="Contoh: Rumpon 1">


<button
onclick="simpanLokasiMancing()">

🎣 SIMPAN LOKASI MANCING

</button>


<!-- =======================
     GPS
======================= -->

<button
onclick="ambilPosisiSaya()">

📍 POSISI SAYA

</button>


<!-- =======================
     KOMPAS
======================= -->

<button
class="kompasBtn"
onclick="aktifkanKompas()">

🧭 AKTIFKAN KOMPAS

</button>


<!-- =======================
     ARAH PULANG
======================= -->

<button
class="pulang"
onclick="arahPulang()">

🧭 ARAH PULANG

</button>


<div id="status">

Belum ada aktivitas.

</div>


<!-- =======================
     NAVIGASI
======================= -->

<div id="navigasi">

<h2>
🧭 ARAH PULANG
</h2>


<div id="panah">

⬆️

</div>


<div id="derajat">

Arah: -

</div>


<div id="arahText">

-

</div>


<div id="jarak">

📏 Jarak: -

</div>


</div>


<!-- =======================
     KOMPAS
======================= -->

<div id="kompas">

<h2>
🧭 KOMPAS
</h2>


<div id="kompasLingkaran">

<div class="angka utara">
N
</div>

<div class="angka timur">
E
</div>

<div class="angka selatan">
S
</div>

<div class="angka barat">
W
</div>


<div id="jarumKompas">
</div>

<div id="titikTengah">
</div>

</div>


<div id="arahKompas">

Arah: -

</div>

</div>


<!-- =======================
     PETA
======================= -->

<h2>
🗺️ Peta
</h2>

<div id="map">
</div>


<!-- =======================
     DAFTAR
======================= -->

<h2>
📋 Lokasi Tersimpan
</h2>

<div id="daftarLokasi">
</div>


</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/*
================================================
NELAYAN PINTAR V5
================================================
*/


// ==============================================
// DATA
// ==============================================

let lokasiTersimpan =
JSON.parse(
localStorage.getItem(
"lokasiNelayan"
)
) || [];


let titikBerangkat =
JSON.parse(
localStorage.getItem(
"titikBerangkat"
)
) || null;


let posisiSaya = null;


// Arah kompas iPhone

let arahKompasSekarang = 0;


// ==============================================
// PETA
// ==============================================

let map =
L.map("map").setView(
[-2.5,118],
5
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{

maxZoom:19,

attribution:
"&copy; OpenStreetMap"

}
).addTo(map);


let markerLayer =
L.layerGroup().addTo(map);


// ==============================================
// AWAL
// ==============================================

tampilkanBerangkat();

tampilkanLokasi();

tampilkanSemuaMarker();


// ==============================================
// SIMPAN TITIK BERANGKAT
// ==============================================

function simpanTitikBerangkat() {

const status =
document.getElementById(
"status"
);


if (!navigator.geolocation) {

status.innerHTML =
"❌ GPS tidak tersedia.";

return;

}


status.innerHTML =
"⏳ Mengambil titik berangkat...";


navigator.geolocation.getCurrentPosition(

function(position) {


titikBerangkat = {

latitude:
position.coords.latitude,

longitude:
position.coords.longitude,

akurasi:
Math.round(
position.coords.accuracy
),

waktu:
new Date()
.toLocaleString("id-ID")

};


localStorage.setItem(

"titikBerangkat",

JSON.stringify(
titikBerangkat
)

);


status.innerHTML =
"✅ Titik berangkat berhasil disimpan.";


tampilkanBerangkat();

tampilkanSemuaMarker();


map.setView(

[
titikBerangkat.latitude,
titikBerangkat.longitude
],

15

);

},

function() {

status.innerHTML =
"❌ GPS gagal mendapatkan lokasi.";

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


// ==============================================
// TAMPILKAN BERANGKAT
// ==============================================

function tampilkanBerangkat() {

const info =
document.getElementById(
"infoBerangkat"
);


if (!titikBerangkat) {

info.innerHTML =
"⚠️ Belum ada titik berangkat.";

return;

}


info.innerHTML = `

<div class="titik">

⚓ <b>Titik Berangkat</b>

<br><br>

📍 Latitude:
${titikBerangkat.latitude}

<br>

📍 Longitude:
${titikBerangkat.longitude}

<br>

🎯 Akurasi:
± ${titikBerangkat.akurasi} meter

<br>

🕐 ${titikBerangkat.waktu}

</div>

`;

}


// ==============================================
// SIMPAN LOKASI MANCING
// ==============================================

function simpanLokasiMancing() {

const nama =
document.getElementById(
"namaLokasi"
).value.trim();


const status =
document.getElementById(
"status"
);


if (!nama) {

alert(
"Masukkan nama lokasi."
);

return;

}


if (!navigator.geolocation) {

status.innerHTML =
"❌ GPS tidak tersedia.";

return;

}


status.innerHTML =
"⏳ Mengambil lokasi GPS...";


navigator.geolocation.getCurrentPosition(

function(position) {


const data = {

nama:nama,

latitude:
position.coords.latitude,

longitude:
position.coords.longitude,

akurasi:
Math.round(
position.coords.accuracy
),

waktu:
new Date()
.toLocaleString("id-ID")

};


lokasiTersimpan.push(
data
);


localStorage.setItem(

"lokasiNelayan",

JSON.stringify(
lokasiTersimpan
)

);


document.getElementById(
"namaLokasi"
).value = "";


status.innerHTML =
"✅ Lokasi mancing tersimpan.";


tampilkanLokasi();

tampilkanSemuaMarker();


map.setView(

[
data.latitude,
data.longitude
],

16

);

},

function() {

status.innerHTML =
"❌ GPS gagal.";

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


// ==============================================
// POSISI SAYA
// ==============================================

function ambilPosisiSaya() {

const status =
document.getElementById(
"status"
);


if (!navigator.geolocation) {

status.innerHTML =
"❌ GPS tidak tersedia.";

return;

}


status.innerHTML =
"⏳ Mencari posisi...";


navigator.geolocation.getCurrentPosition(

function(position) {


posisiSaya = {

latitude:
position.coords.latitude,

longitude:
position.coords.longitude

};


status.innerHTML = `

✅ Posisi ditemukan

<br><br>

Latitude:
${posisiSaya.latitude}

<br>

Longitude:
${posisiSaya.longitude}

<br>

🎯 Akurasi:
± ${Math.round(
position.coords.accuracy
)} meter

`;


tampilkanSemuaMarker();


map.setView(

[
posisiSaya.latitude,
posisiSaya.longitude
],

16

);

},

function() {

status.innerHTML =
"❌ GPS tidak dapat digunakan.";

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


// ==============================================
// AKTIFKAN KOMPAS
// ==============================================

function aktifkanKompas() {

const status =
document.getElementById(
"status"
);


// iPhone / iPad

if (
typeof DeviceOrientationEvent !==
"undefined" &&

typeof DeviceOrientationEvent
.requestPermission ===
"function"
) {


DeviceOrientationEvent
.requestPermission()

.then(function(permission) {


if (permission === "granted") {

mulaiKompas();

}

else {

status.innerHTML =
"❌ Izin kompas ditolak.";

}

})

.catch(function(error) {

status.innerHTML =
"❌ Kompas tidak dapat diaktifkan.";

});


}

else {

// Perangkat/browser
// tidak membutuhkan izin

mulaiKompas();

}

}


// ==============================================
// MULAI KOMPAS
// ==============================================

function mulaiKompas() {

document.getElementById(
"kompas"
).style.display =
"block";


document.getElementById(
"status"
).innerHTML =
"🧭 Kompas aktif.";


window.addEventListener(

"deviceorientation",

updateKompas,

true

);

}


// ==============================================
// UPDATE KOMPAS
// ==============================================

function updateKompas(event) {


let heading = null;


// iOS Safari

if (
event.webkitCompassHeading
!== undefined
) {

heading =
event.webkitCompassHeading;

}


// Browser lain

else if (
event.alpha !== null
) {

heading =
360 - event.alpha;

}


if (heading === null)
return;


arahKompasSekarang =
heading;


// Putar jarum

const jarum =
document.getElementById(
"jarumKompas"
);


jarum.style.transform =

"translate(-50%, -100%) " +

"rotate(" +
heading +
"deg)";


document.getElementById(
"arahKompas"
).innerHTML =

"🧭 Arah: <b>" +

Math.round(heading) +

"°</b> " +

"(" +

namaArah(heading) +

")";


// Jika titik berangkat ada,
// update panah arah pulang

if (
titikBerangkat &&
posisiSaya
) {

updatePanahPulang();

}

}


// ==============================================
// ARAH PULANG
// ==============================================

function arahPulang() {

const status =
document.getElementById(
"status"
);


if (!titikBerangkat) {

alert(
"Simpan titik berangkat terlebih dahulu."
);

return;

}


if (!navigator.geolocation) {

status.innerHTML =
"❌ GPS tidak tersedia.";

return;

}


status.innerHTML =
"⏳ Menghitung arah pulang...";


navigator.geolocation.getCurrentPosition(

function(position) {


posisiSaya = {

latitude:
position.coords.latitude,

longitude:
position.coords.longitude

};


updatePanahPulang();


tampilkanSemuaMarker();


map.setView(

[
posisiSaya.latitude,
posisiSaya.longitude
],

15

);


status.innerHTML =
"✅ Navigasi pulang aktif.";

},

function() {

status.innerHTML =
"❌ GPS tidak dapat mengambil posisi.";

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


// ==============================================
// UPDATE PANAH PULANG
// ==============================================

function updatePanahPulang() {


if (
!posisiSaya ||
!titikBerangkat
)
return;


const jarak =
hitungJarak(

posisiSaya.latitude,

posisiSaya.longitude,

titikBerangkat.latitude,

titikBerangkat.longitude

);


const bearing =
hitungArah(

posisiSaya.latitude,

posisiSaya.longitude,

titikBerangkat.latitude,

titikBerangkat.longitude

);


const arah =
namaArah(bearing);


document.getElementById(
"navigasi"
).style.display =
"block";


document.getElementById(
"derajat"
).innerHTML =

"Arah: <b>" +

Math.round(bearing) +

"°</b>";


document.getElementById(
"arahText"
).innerHTML =

"➡️ " + arah;


document.getElementById(
"jarak"
).innerHTML =

"📏 Jarak: <b>" +

formatJarak(jarak) +

"</b>";


// =================================
// PANAH RELATIF TERHADAP KOMPAS
// =================================

const arahRelatif =

bearing -
arahKompasSekarang;


document.getElementById(
"panah"
).style.transform =

"rotate(" +

arahRelatif +

"deg)";

}


// ==============================================
// HITUNG JARAK
// ==============================================

function hitungJarak(

lat1,
lon1,
lat2,
lon2

) {


const R = 6371;


const dLat =
(lat2-lat1)
*
Math.PI/180;


const dLon =
(lon2-lon1)
*
Math.PI/180;


const a =

Math.sin(dLat/2)
*
Math.sin(dLat/2)

+

Math.cos(
lat1*Math.PI/180
)

*

Math.cos(
lat2*Math.PI/180
)

*

Math.sin(dLon/2)
*
Math.sin(dLon/2);


const c =

2 *
Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);


return R*c;

}


// ==============================================
// HITUNG BEARING
// ==============================================

function hitungArah(

lat1,
lon1,
lat2,
lon2

) {


const φ1 =
lat1 *
Math.PI/180;


const φ2 =
lat2 *
Math.PI/180;


const λ1 =
lon1 *
Math.PI/180;


const λ2 =
lon2 *
Math.PI/180;


const y =

Math.sin(
λ2-λ1
)
*
Math.cos(φ2);


const x =

Math.cos(φ1)
*
Math.sin(φ2)

-

Math.sin(φ1)
*
Math.cos(φ2)
*
Math.cos(
λ2-λ1
);


let θ =

Math.atan2(
y,x
)
*
180/Math.PI;


return (
θ+360
)%360;

}


// ==============================================
// NAMA ARAH
// ==============================================

function namaArah(
derajat
) {


if (
derajat >=337.5 ||
derajat <22.5
)
return "Utara";


if (
derajat <67.5
)
return "Timur Laut";


if (
derajat <112.5
)
return "Timur";


if (
derajat <157.5
)
return "Tenggara";


if (
derajat <202.5
)
return "Selatan";


if (
derajat <247.5
)
return "Barat Daya";


if (
derajat <292.5
)
return "Barat";


return "Barat Laut";

}


// ==============================================
// FORMAT JARAK
// ==============================================

function formatJarak(
km
) {


if (km < 1) {

return Math.round(
km*1000
)
+
" meter";

}


return km.toFixed(2)
+
" km";

}


// ==============================================
// MARKER
// ==============================================

function tampilkanSemuaMarker() {


markerLayer.clearLayers();


// Titik berangkat

if (titikBerangkat) {

L.marker([

titikBerangkat.latitude,

titikBerangkat.longitude

])

.addTo(markerLayer)

.bindPopup(
"⚓ TITIK BERANGKAT"
);

}


// Lokasi mancing

lokasiTersimpan.forEach(

function(lokasi) {


L.marker([

lokasi.latitude,

lokasi.longitude

])

.addTo(markerLayer)

.bindPopup(`

🎣 <b>
${lokasi.nama}
</b>

<br><br>

${lokasi.latitude},

${lokasi.longitude}

`);

});


// Posisi saya

if (posisiSaya) {

L.marker([

posisiSaya.latitude,

posisiSaya.longitude

])

.addTo(markerLayer)

.bindPopup(
"📍 POSISI SAYA"
);

}

}


// ==============================================
// DAFTAR LOKASI
// ==============================================

function tampilkanLokasi() {


const daftar =
document.getElementById(
"daftarLokasi"
);


if (
lokasiTersimpan.length === 0
) {

daftar.innerHTML =
"<p>Belum ada lokasi.</p>";

return;

}


daftar.innerHTML = "";


lokasiTersimpan.forEach(

function(lokasi,index) {


daftar.innerHTML += `

<div class="titik">

🎣 <b>
${lokasi.nama}
</b>

<br><br>

📍
${lokasi.latitude},

${lokasi.longitude}

<br>

🎯 Akurasi:
± ${lokasi.akurasi} meter

<br>

🕐 ${lokasi.waktu}


<button
onclick="lihatTitik(${index})">

🗺️ LIHAT DI PETA

</button>


<button
class="hapus"
onclick="hapusLokasi(${index})">

🗑️ HAPUS

</button>

</div>

`;

});

}


// ==============================================
// LIHAT TITIK
// ==============================================

function lihatTitik(index) {


const lokasi =
lokasiTersimpan[index];


map.setView(

[

lokasi.latitude,

lokasi.longitude

],

16

);

}


// ==============================================
// HAPUS
// ==============================================

function hapusLokasi(index) {


if (
confirm(
"Hapus lokasi ini?"
)
) {


lokasiTersimpan.splice(
index,
1
);


localStorage.setItem(

"lokasiNelayan",

JSON.stringify(
lokasiTersimpan
)

);


tampilkanLokasi();

tampilkanSemuaMarker();

}

}

</script>

</body>

</html>
