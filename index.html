<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelayan Pintar V8.3</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f0f4f8; padding: 15px; color: #333; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { font-size: 1.2rem; margin-bottom: 10px; color: #1e3c72; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        
        /* Mode Switcher */
        .mode-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-mode { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #e0e0e0; color: #666; text-align: center; }
        .btn-mode.active-nelayan { background: #2a5298; color: white; }
        .btn-mode.active-keluarga { background: #27ae60; color: white; }
        
        /* Dashboard Stats */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .info-box { background: #f8f9fa; border-radius: 8px; padding: 10px; border-left: 4px solid #2a5298; }
        .info-label { font-size: 0.75rem; color: #666; }
        .info-val { font-size: 0.95rem; font-weight: bold; margin-top: 3px; word-break: break-all; }
        
        /* Buttons */
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; margin-top: 8px; font-size: 0.95rem; }
        .btn-blue { background: #2a5298; }
        .btn-green { background: #27ae60; }
        .btn-red { background: #e74c3c; }
        .btn-orange { background: #e67e22; }

        /* Map */
        #map { height: 280px; width: 100%; border-radius: 8px; margin-top: 10px; }
        
        /* Status Indicator */
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .status-online { background: #d4edda; color: #155724; }
        .status-sos { background: #f8d7da; color: #721c24; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>

    <!-- Firebase SDK (v9 Realtime Database) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // Konfigurasi Firebase dari screenshot Bapak
        const firebaseConfig = {
            apiKey: "AIzaSyBnbwH-Dc6X6_51w55TQ95FlD",
            authDomain: "nelayan-pintar-481c4.firebaseapp.com",
            projectId: "nelayan-pintar-481c4",
            storageBucket: "nelayan-pintar-481c4.appspot.com",
            messagingSenderId: "984230095089",
            appId: "1:984230095089:web:b1d7d36cb820"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbOnValue = onValue;
    </script>
</head>
<body>

    <!-- Tab Mode Selector -->
    <div class="mode-container">
        <button id="btnNelayan" class="btn-mode active-nelayan" onclick="switchMode('nelayan')">🚤 Mode Nelayan<br><small>(Android Adik)</small></button>
        <button id="btnKeluarga" class="btn-mode" onclick="switchMode('keluarga')">🏠 Mode Keluarga<br><small>(iPhone Bapak)</small></button>
    </div>

    <!-- Mode Nelayan View -->
    <div id="viewNelayan">
        <div class="card">
            <h2>🚤 Posisi Perahu Anda</h2>
            <div class="info-grid">
                <div class="info-box">
                    <div class="info-label">LATITUDE</div>
                    <div id="nelayanLat" class="info-val">Mencari...</div>
                </div>
                <div class="info-box">
                    <div class="info-label">LONGITUDE</div>
                    <div id="nelayanLng" class="info-val">Mencari...</div>
                </div>
            </div>
            <div class="info-box" style="margin-bottom:10px;">
                <div class="info-label">WAKTU UPDATE</div>
                <div id="nelayanTime" class="info-val">-</div>
            </div>
            <button class="btn btn-blue" onclick="kirimLokasiRealtime()">📡 Kirim Update Lokasi ke Rumah</button>
            <button class="btn btn-red" onclick="kirimSOS()">🚨 SYNYAL DARURAT (SOS)</button>
        </div>
    </div>

    <!-- Mode Keluarga View -->
    <div id="viewKeluarga" style="display:none;">
        <div class="card">
            <h2>🏠 Pantau Perahu Nelayan</h2>
            <div style="margin-bottom: 10px;">
                Status: <span id="statusBadge" class="status-badge status-online">Menghubungkan...</span>
            </div>
            <div class="info-grid">
                <div class="info-box">
                    <div class="info-label">LOKASI TERAKHIR</div>
                    <div id="keluargaCoords" class="info-val">Belum ada data</div>
                </div>
                <div class="info-box">
                    <div class="info-label">UPDATE TERAKHIR</div>
                    <div id="keluargaTime" class="info-val">-</div>
                </div>
            </div>
            <a id="btnWA" href="#" target="_blank" class="btn btn-green" style="display:block; text-align:center; text-decoration:none;">💬 Hubungi via WhatsApp</a>
        </div>
    </div>

    <!-- Map Card -->
    <div class="card">
        <h2>🗺️ Peta Navigasi</h2>
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let currentMode = 'nelayan';
        let currentLat = null;
        let currentLng = null;
        let map, marker;

        // Inisialisasi Peta
        function initMap() {
            map = L.map('map').setView([-6.200000, 106.816666], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            marker = L.marker([-6.200000, 106.816666]).addTo(map);
        }

        // Switch Mode (Nelayan / Keluarga)
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnNelayan').className = mode === 'nelayan' ? 'btn-mode active-nelayan' : 'btn-mode';
            document.getElementById('btnKeluarga').className = mode === 'keluarga' ? 'btn-mode active-keluarga' : 'btn-mode';
            
            document.getElementById('viewNelayan').style.display = mode === 'nelayan' ? 'block' : 'none';
            document.getElementById('viewKeluarga').style.display = mode === 'keluarga' ? 'block' : 'none';

            if(mode === 'keluarga') {
                dengarDataFirebase();
            }
        }

        // Dapatkan GPS HP Nelayan
        function updateGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(function(position) {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    const timeStr = new Date().toLocaleTimeString('id-ID');

                    document.getElementById('nelayanLat').innerText = currentLat.toFixed(6);
                    document.getElementById('nelayanLng').innerText = currentLng.toFixed(6);
                    document.getElementById('nelayanTime').innerText = timeStr;

                    if (currentMode === 'nelayan') {
                        marker.setLatLng([currentLat, currentLng]);
                        map.panTo([currentLat, currentLng]);
                    }
                }, function(err) {
                    console.log("GPS Error: " + err.message);
                }, { enableHighAccuracy: true });
            }
        }

        // Kirim Lokasi ke Firebase
        function kirimLokasiRealtime() {
            if (!currentLat || !currentLng) {
                alert("Lokasi GPS belum ditemukan. Pastikan izin lokasi (GPS) aktif!");
                return;
            }
            const timeStr = new Date().toLocaleTimeString('id-ID');
            const data = {
                lat: currentLat,
                lng: currentLng,
                waktu: timeStr,
                sos: false
            };

            if (window.db && window.dbRef && window.dbSet) {
                window.dbSet(window.dbRef(window.db, 'posisi_nelayan'), data)
                    .then(() => alert("✅ Berhasil mengirim lokasi terbaru ke iPhone keluarga!"))
                    .catch((err) => alert("Gagal kirim data: " + err.message));
            } else {
                alert("Menghubungkan ke server Firebase... coba beberapa detik lagi.");
            }
        }

        // Sinyal SOS
        function kirimSOS() {
            if (!currentLat || !currentLng) {
                alert("GPS belum aktif.");
                return;
            }
            const timeStr = new Date().toLocaleTimeString('id-ID');
            const data = {
                lat: currentLat,
                lng: currentLng,
                waktu: timeStr,
                sos: true
            };
            if (window.db) {
                window.dbSet(window.dbRef(window.db, 'posisi_nelayan'), data)
                    .then(() => alert("🚨 SINYAL SOS TERKIRIM KE KELUARGA!"))
                    .catch((err) => alert("Gagal SOS: " + err.message));
            }
        }

        // Terima Data Realtime di iPhone Keluarga
        function dengarDataFirebase() {
            if (window.db && window.dbOnValue) {
                window.dbOnValue(window.dbRef(window.db, 'posisi_nelayan'), (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        document.getElementById('keluargaCoords').innerText = data.lat.toFixed(5) + ", " + data.lng.toFixed(5);
                        document.getElementById('keluargaTime').innerText = data.waktu;
                        
                        const badge = document.getElementById('statusBadge');
                        if (data.sos) {
                            badge.innerText = "🚨 DARURAT (SOS)!";
                            badge.className = "status-badge status-sos";
                        } else {
                            badge.innerText = "🟢 Terhubung";
                            badge.className = "status-badge status-online";
                        }

                        marker.setLatLng([data.lat, data.lng]);
                        map.panTo([data.lat, data.lng]);

                        const waMsg = `https://wa.me/?text=Posisi%20Perahu%20Nelayan:%20https://maps.google.com/?q=${data.lat},${data.lng}`;
                        document.getElementById('btnWA').href = waMsg;
                    }
                });
            }
        }

        window.onload = function() {
            initMap();
            updateGPS();
        };
    </script>
</body>
</html>
