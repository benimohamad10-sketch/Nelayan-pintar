<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Nelayan Pintar V6</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eaf7ff;
    margin: 0;
    padding: 15px;
}

.app {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

h1 {
    text-align: center;
    color: #006994;
}

h2 {
    color: #006994;
    margin-top: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    background: #0077b6;
    color: white;
}

button:active {
    transform: scale(.98);
}

.orange {
    background: #f77f00;
}

.green {
    background: #008000;
}

.purple {
    background: #6a4c93;
}

.red {
    background: #d62828;
}

.dark {
    background: #333;
}

#status {
    margin-top: 15px;
    padding: 14px;
    background: #f1f9fc;
    border-radius: 12px;
}

/* =========================
   NAVIGASI
========================= */

#navigasi {
    display: none;
    margin-top: 15px;
    padding: 20px;
    background: #eef9ee;
    border-radius: 18px;
    text-align: center;
}

#tujuanAktif {
    font-size: 20px;
    font-weight: bold;
}

#panah {
    width: 170px;
    height: 170px;

    margin: 15px auto;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 110px;

    transform: rotate(0deg);

    transition: transform .3s ease;
}

#derajat {
    font-size: 27px;
    font-weight: bold;
}

#arahText {
    font-size: 21px;
    margin-top: 8px;
}

#jarak {
    font-size: 24px;
    margin-top: 12px;
}

/* =========================
   PETA
========================= */

#map {
    width: 100%;
    height: 430px;
    margin-top: 15px;
    border-radius: 15px;
}

/* =========================
   LOKASI
========================= */

.titik {
    margin-top: 12px;
    padding: 14px;
    background: #f5f5f5;
    border-radius: 12px;
}

.tujuan {
    border: 3px solid #008000;
    background: #eef9ee;
}

</style>

</head>

<body>


<div class="app">


<h1>🚤 NELAYAN PINTAR</h1>

<p style="text-align:center">
🧭 GPS • Rute • Arah Pulang
</p>


<!-- ==================================
     TITIK BERANGKAT
================================== -->

<h2>⚓ Titik Berangkat</h2>

<button
class="orange"
onclick="simpanTitikBerangkat()">

⚓ SIMPAN TITIK BERANGKAT

</button>

<div id="infoBerangkat">

Belum ada titik berangkat.

</div>


<!-- ==================================
     LOKASI BARU
================================== -->

<h2>🎣 Simpan Lokasi Mancing</h2>

<input
id="namaLokasi"
type="text"
placeholder="Contoh: Rumpon 1">


<button
onclick="simpanLokasiMancing()">

🎣 SIMPAN LOKASI

</button>


<!-- ==================================
     GPS
================================== -->

<button
onclick="ambilPosisiSaya()">

📍 PERBARUI POSISI SAYA

</button>


<!-- ==================================
     ARAH PULANG
================================== -->

<button
class="green"
onclick="arahPulang()">

⚓ ARAH PULANG

</button>


<div id="status">

Belum ada aktivitas.

</div>


<!-- ==================================
     NAVIGASI
================================== -->

<div id="navigasi">

<div id="tujuanAktif">

Tujuan: -

</div>


<div id="panah">

⬆️

</div>


<div id="derajat">

Arah: -

</div>


<div id="arahText">

-

</div>


<div id="jarak">

📏 Jarak: -

</div>

</div>


<!-- ==================================
     PETA
================================== -->

<h2>🗺️ Peta Navigasi</h2>

<div id="map"></div>


<!-- ==================================
     DAFTAR LOKASI
================================== -->

<h2>📋 Lokasi Mancing</h2>

<div id="daftarLokasi">

</div>


</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/*
================================================
NELAYAN PINTAR V6
================================================
*/


// ==============================================
// DATA
// ==============================================

let lokasiTersimpan =
JSON.parse(
localStorage.getItem(
"lokasiNelayan"
)
) || [];


let titikBerangkat =
JSON.parse(
localStorage.getItem(
"titikBerangkat"
)
) || null;


let posisiSaya = null;


// Tujuan aktif

let tujuanAktif = null;


// ==============================================
// PETA
// ==============================================

let map =
L.map("map").setView(
[-2.5,118],
5
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
    maxZoom: 19,
    attribution:
    "&copy; OpenStreetMap"
}
).addTo(map);


// Layer marker

let markerLayer =
L.layerGroup().addTo(map);


// Garis rute

let garisRute = null;


// ==============================================
// AWAL
// ==============================================

tampilkanBerangkat();

tampilkanLokasi();

tampilkanSemuaMarker();


// ==============================================
// SIMPAN TITIK BERANGKAT
// ==============================================

function simpanTitikBerangkat() {

    const status =
    document.getElementById(
    "status"
    );


    if (!navigator.geolocation) {

        status.innerHTML =
        "❌ GPS tidak tersedia.";

        return;
    }


    status.innerHTML =
    "⏳ Mengambil titik berangkat...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            titikBerangkat = {

                latitude:
                position.coords.latitude,

                longitude:
                position.coords.longitude,

                akurasi:
                Math.round(
                position.coords.accuracy
                ),

                waktu:
                new Date()
                .toLocaleString("id-ID")

            };


            localStorage.setItem(

                "titikBerangkat",

                JSON.stringify(
                titikBerangkat
                )

            );


            status.innerHTML =
            "✅ Titik berangkat tersimpan.";


            tampilkanBerangkat();

            tampilkanSemuaMarker();


            map.setView(

                [
                titikBerangkat.latitude,
                titikBerangkat.longitude
                ],

                15

            );

        },

        function() {

            status.innerHTML =
            "❌ GPS gagal mendapatkan lokasi.";

        },

        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );

}


// ==============================================
// TAMPILKAN BERANGKAT
// ==============================================

function tampilkanBerangkat() {

    const info =
    document.getElementById(
    "infoBerangkat"
    );


    if (!titikBerangkat) {

        info.innerHTML =
        "⚠️ Belum ada titik berangkat.";

        return;
    }


    info.innerHTML = `

    <div class="titik">

        ⚓ <b>Titik Berangkat</b>

        <br><br>

        📍 ${titikBerangkat.latitude}

        <br>

        📍 ${titikBerangkat.longitude}

        <br>

        🎯 Akurasi:
        ± ${titikBerangkat.akurasi} meter

        <br>

        🕐 ${titikBerangkat.waktu}

    </div>

    `;

}


// ==============================================
// SIMPAN LOKASI MANCING
// ==============================================

function simpanLokasiMancing() {

    const nama =
    document.getElementById(
    "namaLokasi"
    ).value.trim();


    const status =
    document.getElementById(
    "status"
    );


    if (!nama) {

        alert(
        "Masukkan nama lokasi."
        );

        return;
    }


    if (!navigator.geolocation) {

        status.innerHTML =
        "❌ GPS tidak tersedia.";

        return;
    }


    status.innerHTML =
    "⏳ Mengambil posisi GPS...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const data = {

                nama: nama,

                latitude:
                position.coords.latitude,

                longitude:
                position.coords.longitude,

                akurasi:
                Math.round(
                position.coords.accuracy
                ),

                waktu:
                new Date()
                .toLocaleString("id-ID")

            };


            lokasiTersimpan.push(data);


            localStorage.setItem(

                "lokasiNelayan",

                JSON.stringify(
                lokasiTersimpan
                )

            );


            document.getElementById(
            "namaLokasi"
            ).value = "";


            status.innerHTML =
            "✅ Lokasi tersimpan.";


            tampilkanLokasi();

            tampilkanSemuaMarker();


            // Langsung jadikan tujuan

            pilihTujuan(
            data
            );

        },

        function() {

            status.innerHTML =
            "❌ GPS gagal mendapatkan lokasi.";

        },

        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );

}


// ==============================================
// POSISI SAYA
// ==============================================

function ambilPosisiSaya() {

    const status =
    document.getElementById(
    "status"
    );


    if (!navigator.geolocation) {

        status.innerHTML =
        "❌ GPS tidak tersedia.";

        return;
    }


    status.innerHTML =
    "⏳ Mengambil posisi sekarang...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            posisiSaya = {

                latitude:
                position.coords.latitude,

                longitude:
                position.coords.longitude,

                akurasi:
                Math.round(
                position.coords.accuracy
                )

            };


            status.innerHTML = `

            ✅ Posisi diperbarui.

            <br><br>

            📍 ${posisiSaya.latitude}

            <br>

            📍 ${posisiSaya.longitude}

            <br>

            🎯 Akurasi:
            ± ${posisiSaya.akurasi} meter

            `;


            tampilkanSemuaMarker();


            // Update rute jika ada tujuan

            if (tujuanAktif) {

                updateNavigasi();

            }


            map.setView(

                [
                posisiSaya.latitude,
                posisiSaya.longitude
                ],

                16

            );

        },

        function() {

            status.innerHTML =
            "❌ GPS tidak dapat digunakan.";

        },

        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );

}


// ==============================================
// ARAH PULANG
// ==============================================

function arahPulang() {

    if (!titikBerangkat) {

        alert(
        "Simpan titik berangkat terlebih dahulu."
        );

        return;
    }


    tujuanAktif = {

        tipe: "berangkat",

        nama: "⚓ TITIK BERANGKAT",

        latitude:
        titikBerangkat.latitude,

        longitude:
        titikBerangkat.longitude

    };


    document.getElementById(
    "status"
    ).innerHTML =
    "🧭 Menuju titik berangkat...";


    ambilPosisiSaya();

}


// ==============================================
// PILIH TUJUAN MANCING
// ==============================================

function pilihTujuan(lokasi) {

    tujuanAktif = {

        tipe: "mancing",

        nama: lokasi.nama,

        latitude:
        lokasi.latitude,

        longitude:
        lokasi.longitude

    };


    document.getElementById(
    "status"
    ).innerHTML =

    "🎣 Tujuan dipilih: " +
    lokasi.nama;


    ambilPosisiSaya();

}


// ==============================================
// UPDATE NAVIGASI
// ==============================================

function updateNavigasi() {

    if (
        !posisiSaya ||
        !tujuanAktif
    ) {

        return;
    }


    // =================================
    // JARAK
    // =================================

    const jarak =
    hitungJarak(

        posisiSaya.latitude,

        posisiSaya.longitude,

        tujuanAktif.latitude,

        tujuanAktif.longitude

    );


    // =================================
    // BEARING
    // =================================

    const bearing =
    hitungArah(

        posisiSaya.latitude,

        posisiSaya.longitude,

        tujuanAktif.latitude,

        tujuanAktif.longitude

    );


    const arah =
    namaArah(
    bearing
    );


    // =================================
    // PANEL
    // =================================

    document.getElementById(
    "navigasi"
    ).style.display =
    "block";


    document.getElementById(
    "tujuanAktif"
    ).innerHTML =

    "🎯 Tujuan: <b>" +
    tujuanAktif.nama +
    "</b>";


    document.getElementById(
    "derajat"
    ).innerHTML =

    "Arah: <b>" +
    Math.round(bearing) +
    "°</b>";


    document.getElementById(
    "arahText"
    ).innerHTML =

    "➡️ " + arah;


    document.getElementById(
    "jarak"
    ).innerHTML =

    "📏 Jarak: <b>" +
    formatJarak(jarak) +
    "</b>";


    // =================================
    // PANAH
    // =================================

    document.getElementById(
    "panah"
    ).style.transform =

    "rotate(" +
    bearing +
    "deg)";


    // =================================
    // GARIS RUTE
    // =================================

    gambarRute();

}


// ==============================================
// GAMBAR RUTE
// ==============================================

function gambarRute() {

    if (!posisiSaya || !tujuanAktif)
    return;


    // Hapus garis lama

    if (garisRute) {

        map.removeLayer(
        garisRute
        );

    }


    // Buat garis baru

    garisRute =
    L.polyline(

        [

            [
            posisiSaya.latitude,
            posisiSaya.longitude
            ],

            [
            tujuanAktif.latitude,
            tujuanAktif.longitude
            ]

        ],

        {

            color: "blue",

            weight: 5,

            opacity: 0.8,

            dashArray: "10,8"

        }

    ).addTo(map);


    // Zoom supaya kedua titik terlihat

    map.fitBounds(
    garisRute.getBounds(),
    {
        padding: [30,30]
    }
    );

}


// ==============================================
// HITUNG JARAK
// ==============================================

function hitungJarak(

    lat1,
    lon1,
    lat2,
    lon2

) {

    const R = 6371;


    const dLat =
    (lat2-lat1)
    *
    Math.PI/180;


    const dLon =
    (lon2-lon1)
    *
    Math.PI/180;


    const a =

    Math.sin(dLat/2)
    *
    Math.sin(dLat/2)

    +

    Math.cos(
    lat1*Math.PI/180
    )

    *

    Math.cos(
    lat2*Math.PI/180
    )

    *

    Math.sin(dLon/2)
    *
    Math.sin(dLon/2);


    const c =

    2 *
    Math.atan2(

        Math.sqrt(a),

        Math.sqrt(1-a)

    );


    return R*c;

}


// ==============================================
// HITUNG ARAH
// ==============================================

function hitungArah(

    lat1,
    lon1,
    lat2,
    lon2

) {

    const φ1 =
    lat1 *
    Math.PI/180;


    const φ2 =
    lat2 *
    Math.PI/180;


    const λ1 =
    lon1 *
    Math.PI/180;


    const λ2 =
    lon2 *
    Math.PI/180;


    const y =

    Math.sin(
    λ2-λ1
    )
    *
    Math.cos(φ2);


    const x =

    Math.cos(φ1)
    *
    Math.sin(φ2)

    -

    Math.sin(φ1)
    *
    Math.cos(φ2)
    *
    Math.cos(
    λ2-λ1
    );


    let θ =

    Math.atan2(
    y,
    x
    )
    *
    180/Math.PI;


    return (
    θ+360
    )%360;

}


// ==============================================
// NAMA ARAH
// ==============================================

function namaArah(
    derajat
) {

    if (
        derajat >= 337.5 ||
        derajat < 22.5
    )
    return "Utara";


    if (
        derajat < 67.5
    )
    return "Timur Laut";


    if (
        derajat < 112.5
    )
    return "Timur";


    if (
        derajat < 157.5
    )
    return "Tenggara";


    if (
        derajat < 202.5
    )
    return "Selatan";


    if (
        derajat < 247.5
    )
    return "Barat Daya";


    if (
        derajat < 292.5
    )
    return "Barat";


    return "Barat Laut";

}


// ==============================================
// FORMAT JARAK
// ==============================================

function formatJarak(km) {

    if (km < 1) {

        return Math.round(
        km * 1000
        ) + " meter";

    }


    return km.toFixed(2)
    + " km";

}


// ==============================================
// MARKER
// ==============================================

function tampilkanSemuaMarker() {

    markerLayer.clearLayers();


    // =================================
    // TITIK BERANGKAT
    // =================================

    if (titikBerangkat) {

        L.marker(

            [
            titikBerangkat.latitude,
            titikBerangkat.longitude
            ]

        )

        .addTo(markerLayer)

        .bindPopup(
        "⚓ TITIK BERANGKAT"
        );

    }


    // =================================
    // LOKASI MANCING
    // =================================

    lokasiTersimpan.forEach(

        function(lokasi) {

            const marker =
            L.marker(

                [
                lokasi.latitude,
                lokasi.longitude
                ]

            )

            .addTo(markerLayer);


            marker.bindPopup(`

                🎣 <b>
                ${lokasi.nama}
                </b>

                <br><br>

                ${lokasi.latitude}

                <br>

                ${lokasi.longitude}

                <br><br>

                <button
                onclick="pilihTujuanDariIndex(${lokasiTersimpan.indexOf(lokasi)})">

                🎯 JADIKAN TUJUAN

                </button>

            `);

        }

    );


    // =================================
    // POSISI SAYA
    // =================================

    if (posisiSaya) {

        L.marker(

            [
            posisiSaya.latitude,
            posisiSaya.longitude
            ]

        )

        .addTo(markerLayer)

        .bindPopup(
        "📍 POSISI PERAHU"
        );

    }

}


// ==============================================
// PILIH TUJUAN DARI MARKER
// ==============================================

function pilihTujuanDariIndex(index) {

    const lokasi =
    lokasiTersimpan[index];


    pilihTujuan(
    lokasi
    );

}


// ==============================================
// DAFTAR LOKASI
// ==============================================

function tampilkanLokasi() {

    const daftar =
    document.getElementById(
    "daftarLokasi"
    );


    if (
    lokasiTersimpan.length === 0
    ) {

        daftar.innerHTML =
        "<p>Belum ada lokasi.</p>";

        return;
    }


    daftar.innerHTML = "";


    lokasiTersimpan.forEach(

        function(lokasi,index) {


            daftar.innerHTML += `

            <div class="titik">

                🎣 <b>
                ${lokasi.nama}
                </b>

                <br><br>

                📍
                ${lokasi.latitude},

                ${lokasi.longitude}

                <br>

                🎯 Akurasi:
                ± ${lokasi.akurasi} meter

                <br>

                🕐 ${lokasi.waktu}


                <button
                onclick="pilihTujuanDariIndex(${index})">

                🎯 MENUJU KE SINI

                </button>


                <button
                onclick="lihatTitik(${index})">

                🗺️ LIHAT DI PETA

                </button>


                <button
                class="red"
                onclick="hapusLokasi(${index})">

                🗑️ HAPUS

                </button>

            </div>

            `;

        }

    );

}


// ==============================================
// LIHAT TITIK
// ==============================================

function lihatTitik(index) {

    const lokasi =
    lokasiTersimpan[index];


    map.setView(

        [
        lokasi.latitude,
        lokasi.longitude
        ],

        16

    );

}


// ==============================================
// HAPUS
// ==============================================

function hapusLokasi(index) {

    if (
        confirm(
        "Hapus lokasi ini?"
        )
    ) {


        lokasiTersimpan.splice(
        index,
        1
        );


        localStorage.setItem(

            "lokasiNelayan",

            JSON.stringify(
            lokasiTersimpan
            )

        );


        tampilkanLokasi();

        tampilkanSemuaMarker();

    }

}

</script>

</body>

</html>
