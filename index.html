<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nelayan Pintar</title>

<!-- Leaflet Map -->
<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

body {
    font-family: Arial, sans-serif;
    background: #eaf7ff;
    margin: 0;
    padding: 15px;
}

.app {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

h1 {
    text-align: center;
    color: #006994;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    background: #0077b6;
    color: white;
}

#status {
    margin-top: 12px;
    padding: 12px;
    background: #f1f9fc;
    border-radius: 10px;
}

#map {
    width: 100%;
    height: 400px;
    margin-top: 15px;
    border-radius: 15px;
}

.titik {
    margin-top: 12px;
    padding: 12px;
    background: #f5f5f5;
    border-radius: 10px;
}

.hapus {
    background: #d62828;
}

</style>

</head>

<body>

<div class="app">

<h1>🚤 NELAYAN PINTAR</h1>

<p style="text-align:center">
🗺️ Peta Lokasi Mancing
</p>

<input
    id="namaLokasi"
    type="text"
    placeholder="Contoh: Rumpon 1">

<button onclick="ambilDanSimpan()">
🎣 SIMPAN LOKASI MANCING
</button>

<button onclick="ambilPosisiSaya()">
📍 POSISI SAYA
</button>

<div id="status">
Lokasi belum diambil.
</div>

<div id="map"></div>

<h2>🎣 Lokasi Tersimpan</h2>

<div id="daftarLokasi"></div>

</div>


<!-- Leaflet -->
<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

// =====================================
// DATA LOKASI
// =====================================

let lokasiTersimpan =
JSON.parse(
    localStorage.getItem("lokasiNelayan")
) || [];


// =====================================
// BUAT PETA
// =====================================

let map = L.map("map").setView(
    [-2.5, 118],
    5
);


// Peta OpenStreetMap

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
    }
).addTo(map);


// Layer untuk marker

let markerLayer =
L.layerGroup().addTo(map);


// Tampilkan titik lama

tampilkanLokasi();


// =====================================
// TAMPILKAN SEMUA TITIK
// =====================================

function tampilkanLokasi() {

    const daftar =
        document.getElementById(
            "daftarLokasi"
        );

    markerLayer.clearLayers();

    daftar.innerHTML = "";


    if (lokasiTersimpan.length === 0) {

        daftar.innerHTML =
        "<p>Belum ada lokasi.</p>";

        return;
    }


    lokasiTersimpan.forEach(
        function(lokasi, index) {


        // =============================
        // MARKER PETA
        // =============================

        const marker =
        L.marker([
            lokasi.latitude,
            lokasi.longitude
        ]).addTo(markerLayer);


        marker.bindPopup(`
            <b>🎣 ${lokasi.nama}</b>
            <br><br>
            Latitude:
            ${lokasi.latitude}
            <br>
            Longitude:
            ${lokasi.longitude}
            <br><br>
            Akurasi:
            ± ${lokasi.akurasi} meter
            <br><br>
            ${lokasi.waktu}
        `);


        // =============================
        // DAFTAR LOKASI
        // =============================

        daftar.innerHTML += `

        <div class="titik">

            <b>🎣 ${lokasi.nama}</b>

            <br><br>

            📍 ${lokasi.latitude},
            ${lokasi.longitude}

            <br>

            🎯 Akurasi:
            ± ${lokasi.akurasi} meter

            <br>

            🕐 ${lokasi.waktu}

            <button
            onclick="lihatTitik(${index})">

            🗺️ LIHAT DI PETA

            </button>

            <button
            class="hapus"
            onclick="hapusLokasi(${index})">

            🗑️ HAPUS

            </button>

        </div>

        `;

    });

}


// =====================================
// LIHAT TITIK DI PETA
// =====================================

function lihatTitik(index) {

    const lokasi =
        lokasiTersimpan[index];

    map.setView(
        [
            lokasi.latitude,
            lokasi.longitude
        ],
        16
    );

}


// =====================================
// AMBIL POSISI GPS
// =====================================

function ambilPosisiSaya() {

    const status =
        document.getElementById("status");


    if (!navigator.geolocation) {

        status.innerHTML =
        "❌ GPS tidak tersedia.";

        return;
    }


    status.innerHTML =
    "⏳ Mencari posisi GPS...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            const akurasi =
                Math.round(
                    position.coords.accuracy
                );


            status.innerHTML = `

            ✅ Posisi ditemukan

            <br><br>

            Latitude:
            ${lat}

            <br>

            Longitude:
            ${lon}

            <br>

            Akurasi:
            ± ${akurasi} meter

            `;


            // Pindahkan peta

            map.setView(
                [lat, lon],
                16
            );


            // Marker posisi saya

            L.marker([lat, lon])
            .addTo(markerLayer)
            .bindPopup(
                "📍 POSISI SAYA"
            )
            .openPopup();

        },


        function() {

            status.innerHTML =
            "❌ Tidak dapat mengambil GPS. " +
            "Pastikan izin lokasi diberikan.";

        },


        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


// =====================================
// SIMPAN LOKASI MANCING
// =====================================

function ambilDanSimpan() {

    const nama =
        document.getElementById(
            "namaLokasi"
        ).value.trim();


    const status =
        document.getElementById(
            "status"
        );


    if (!nama) {

        alert(
            "Masukkan nama lokasi."
        );

        return;
    }


    if (!navigator.geolocation) {

        status.innerHTML =
        "❌ GPS tidak tersedia.";

        return;
    }


    status.innerHTML =
    "⏳ Mengambil lokasi...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const data = {

                nama: nama,

                latitude:
                    position.coords.latitude,

                longitude:
                    position.coords.longitude,

                akurasi:
                    Math.round(
                        position.coords.accuracy
                    ),

                waktu:
                    new Date()
                    .toLocaleString("id-ID")
            };


            lokasiTersimpan.push(data);


            localStorage.setItem(
                "lokasiNelayan",
                JSON.stringify(
                    lokasiTersimpan
                )
            );


            status.innerHTML =
            "✅ Lokasi berhasil disimpan!";


            document.getElementById(
                "namaLokasi"
            ).value = "";


            tampilkanLokasi();


            // Fokus ke titik baru

            map.setView(
                [
                    data.latitude,
                    data.longitude
                ],
                16
            );

        },


        function() {

            status.innerHTML =
            "❌ GPS gagal mendapatkan lokasi.";

        },


        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


// =====================================
// HAPUS LOKASI
// =====================================

function hapusLokasi(index) {

    if (
        confirm(
            "Hapus lokasi ini?"
        )
    ) {

        lokasiTersimpan.splice(
            index,
            1
        );


        localStorage.setItem(
            "lokasiNelayan",
            JSON.stringify(
                lokasiTersimpan
            )
        );


        tampilkanLokasi();

    }

}

</script>

</body>
</html>
